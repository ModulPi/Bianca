# Bianca 基础栈：API + Web（PoC 默认 SQLite，见 deploy/compose/ 叠加 PG/Redis）
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - api
    restart: unless-stopped
