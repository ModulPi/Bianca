[project]
name = "bianca"
version = "0.1.0"
description = "Bianca — crypto auto-trading Agent (PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "redis>=5.0",
    "ccxt>=4.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pg: PostgreSQL M4 stack integration (BIANCA_PG_E2E=1 + DATABASE_URL)",
    "no_db: skip autouse database initialization",
]
